name: Weekly Trends Refresh

# Google Trends data itself only updates on a weekly cadence, so a weekly
# refresh keeps the dashboard current without wasting Apify usage.
on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday, 06:00 UTC
  workflow_dispatch: {}    # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Prophet's first import compiles a cmdstan binary, which is slow
      # (~1-2 min). Caching it means only the very first run pays that cost.
      - name: Cache cmdstan
        uses: actions/cache@v4
        with:
          path: |
            ~/.cmdstan
            ~/.cache/cmdstanpy
          key: cmdstan-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Keyword list finalized via lag-correlation testing against real
      # RevenueCat revenue per app (Aug 2026) -- these are the empirically
      # best-performing search phrase per app, not just the most "obvious"
      # one. See keyword_research/top15_compare_groups.csv for the winner
      # column and reasoning per app.
      - name: Run scrape + forecast for all tracked keywords
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python scripts/scrape_and_forecast.py \
            "teas test" "CompTIA certification" "aswb exam" "emt certification" "ancc certification" \
            "cna test" "hesi exam" "pharmacy tech certification" "nclex exam" "servsafe exam" \
            "AAPC CPC" "BCEN certification" "real estate exam" "CCRN exam" "PMP exam" \
            "GED test" "ASVAB test" "LSAT test" "Cosmetology exam" "CCNA certification" \
            "Firefighter test" "Praxis test" "SAT prep" "Personal trainer certification" "ACT test" \
            "ASE certification" "CSCS certification" "Journeyman electrician test" "NCE exam" "Phlebotomy certification" \
            "MBLEX exam" "NREMT paramedic" "SHRM certification" "HiSET test" "Plumber exam"

      # The job can run for several minutes (Apify actor + Prophet fits).
      # If you push a commit to main while it's running, a plain "git push"
      # would get rejected ("fetch first") because the runner's checkout is
      # now stale. Rebase onto the latest main right before pushing, with a
      # couple of retries, so this never blocks a week's data refresh.
      # Two things the run leaves behind besides the data files, both of which
      # broke this step on 2026-08-26:
      #   * state/peak_ledger.json -- a TRACKED file the run rewrites every week
      #     (it accumulates predictions and resolves old ones). Not staging it
      #     left the tree dirty.
      #   * scripts/__pycache__/ -- untracked bytecode Python writes on import.
      # Either one makes `git rebase` abort before it even contacts the remote
      # ("cannot rebase: You have unstaged changes"), and the retry loop below
      # then misreports that as a concurrent push and burns all three attempts
      # on a cause that cannot change. So: stage the ledger, then force the tree
      # clean before rebasing. Discarding is safe -- the commit above already
      # captured everything wanted, and the runner is destroyed afterwards.
      - name: Commit updated data
        run: |
          git config user.name "trends-bot"
          git config user.email "trends-bot@users.noreply.github.com"
          git add docs/data/*.json state/peak_ledger.json
          git diff --cached --quiet && echo "No data changes this week." && exit 0
          git commit -m "Weekly Trends refresh $(date -u +%Y-%m-%d)"
          git checkout -- .
          git clean -fdq
          for i in 1 2 3; do
            git fetch origin main
            echo "worktree state before rebase (should be empty):"
            git status --porcelain
            if git rebase origin/main && git push; then
              echo "Pushed successfully."
              break
            fi
            echo "Push attempt $i failed (likely a concurrent push) -- retrying in 5s..."
            git rebase --abort 2>/dev/null || true
            sleep 5
            if [ "$i" = "3" ]; then
              echo "Push failed after 3 attempts."
              exit 1
            fi
          done
