name: Revenue Correlation Refresh

# Runs whenever the RevenueCat CSV is replaced (your monthly update), plus a
# manual trigger. Does NOT run on the weekly Trends cron — no need to
# recompute this every week, revenue doesn't move that fast.
on:
  push:
    paths:
      - "data/revenue/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  correlate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Compute Trends <-> Revenue correlation
        run: python scripts/compute_revenue_correlation.py

      - name: Commit updated correlation data
        run: |
          git config user.name "trends-bot"
          git config user.email "trends-bot@users.noreply.github.com"
          git add docs/data/correlation.json
          git diff --cached --quiet && echo "No correlation changes." && exit 0
          git commit -m "Revenue correlation refresh $(date -u +%Y-%m-%d)"
          git push
